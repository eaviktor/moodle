spring.application.name=moodle
spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret
management.endpoints.web.exposure.include=health,info,metrics,threaddump,loggers,liquibase
management.endpoints.access.default=read-only
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
management.info.process.enabled=true
